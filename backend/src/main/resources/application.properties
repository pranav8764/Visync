spring.application.name=backend
server.port=8080

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/visync}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Redis (disabled — using custom HMAC tokens, not HTTP sessions) ──
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.session.store-type=none

# ─── CORS ────────────────────────────────────────────────────────────
visync.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}