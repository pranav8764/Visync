spring.application.name=backend
server.port=${PORT:8080}


# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db.arfruleokapnklxbfzik.supabase.co:6543/postgres?user=postgres&password=${DATABASE_PASSWORD:}}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fix for PgBouncer / Postgres connection pooling issues
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

visync.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://10.191.177.243:3000,http://10.191.177.243:3001}

# ─── Logging ──────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.visync=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN
