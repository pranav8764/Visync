# ─── Production Profile ──────────────────────────────────────────────
# Activate with: --spring.profiles.active=prod
# All values MUST come from environment variables in production.

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── Redis (disabled — using custom HMAC tokens, not HTTP sessions) ──
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.session.store-type=none

# ─── CORS ────────────────────────────────────────────────────────────
visync.cors.allowed-origins=${ALLOWED_ORIGINS}
