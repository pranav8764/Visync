# ─── Production Profile ──────────────────────────────────────────────
# Activate with: --spring.profiles.active=prod
# All values MUST come from environment variables in production.

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── Redis ───────────────────────────────────────────────────────────
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.user=${REDIS_USER:}
spring.session.store-type=redis

# ─── CORS ────────────────────────────────────────────────────────────
visync.cors.allowed-origins=${ALLOWED_ORIGINS}

# ─── Hikari Connection Pool ──────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=32

# ─── Logging ──────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.visync=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN



