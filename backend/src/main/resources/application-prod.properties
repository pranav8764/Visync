# ─── Production Profile ──────────────────────────────────────────────
# Activate with: --spring.profiles.active=prod
# All values MUST come from environment variables in production.

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── CORS ────────────────────────────────────────────────────────────
visync.cors.allowed-origins=${ALLOWED_ORIGINS}

# ─── Hikari Connection Pool ──────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=60000

# Keep thread stacks and queued requests bounded on small containers.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# ─── Logging ──────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.visync=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN

